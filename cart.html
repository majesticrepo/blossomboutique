<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Blossom Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav" id="nav">
  <span class="brand brand-with-mark"><span class="brand-word">Blossom</span><img class="brand-rose" src="images/logo-rose.png" alt=""><span class="brand-word">Boutique</span></span>
  <div class="nav-right" id="navRight">
    <ul id="navLinks">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="unfold.html">The Unfold</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="contact.html">Contacts</a></li>
      <li><a href="cart.html" class="nav-cart-link is-active">Cart<span class="cart-count" id="cartCount" hidden>0</span></a></li>
    </ul>
    <div class="nav-dots">
    <a class="nav-dot" href="index.html#page-red" style="background:#C0392B;" title="Red"></a>
    <a class="nav-dot" href="index.html#page-orange" style="background:#D96C2B;" title="Orange"></a>
    <a class="nav-dot" href="index.html#page-yellow" style="background:#DDAF35;" title="Yellow"></a>
    <a class="nav-dot" href="index.html#page-green" style="background:#6B8F52;" title="Green"></a>
    <a class="nav-dot" href="index.html#page-blue" style="background:#5F8DBF;" title="Blue"></a>
    <a class="nav-dot" href="index.html#page-purple" style="background:#8B6FA8;" title="Purple"></a>
    <a class="nav-dot" href="index.html#page-pink" style="background:#E39FB0;" title="Pink"></a>
    <a class="nav-dot" href="index.html#page-brown" style="background:#7B5A3E;" title="Brown"></a>
    <a class="nav-dot" href="index.html#page-black" style="background:#2A2622;" title="Black"></a>
    <a class="nav-dot nav-dot-white" href="index.html#page-white" title="White"></a>
    <a class="nav-dot" href="index.html#page-beige" style="background:#D8C7A8;" title="Beige"></a>
    <a class="nav-dot" href="index.html#page-gold" style="background:#9C7A32;" title="Gold"></a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="cart-page" id="cart" style="padding-top:20vh;">

  <div class="section-head">
    <span class="section-eyebrow">Your Selection</span>
    <h2 class="section-title">Your <em>Cart</em></h2>
  </div>

  <div class="cart-wrap" id="cartWrap">
    <p class="cart-empty" id="cartEmpty">Your cart is empty. <a href="products.html">Browse the collection &rarr;</a></p>
    <ul class="cart-list" id="cartList" hidden></ul>
    <div class="cart-summary" id="cartSummary" hidden>
      <div class="cart-summary-row">
        <span class="cart-total-label">Items</span>
        <span class="cart-total-value" id="cartTotalCount">0</span>
      </div>
      <div class="cart-summary-row">
        <span class="cart-total-label">Subtotal</span>
        <span class="cart-total-value" id="cartTotalPrice">$0.00</span>
      </div>
      <a class="review-submit cart-checkout-btn" href="checkout.html">Pay / Buy Now</a>
    </div>
  </div>

</section>

<footer>
  <span class="brand wave-text">Blossom Boutique</span>
  <p class="wave-text">Handcrafted fans, wrapped with care</p>
</footer>

<script src="js/main.js" defer></script>

</body>
</html>
